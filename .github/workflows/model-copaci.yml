name: Antrenare model copaci (YOLO-World)

# Modelul care caută după nume (trunchi de copac, groapă, indicator), exportat în ONNX pentru programul Drum.
# Rezultatul: Release "model" -> drum_v2.onnx (îl descarcă analiza și construirea exe-ului).
on:
  workflow_dispatch:
    inputs:
      varianta:
        description: "s (mic, rapid) sau m (mai precis)"
        default: "s"
      copac:
        description: "cuvantul cautat pentru copac (tree, tree trunk...)"
        default: "tree"

permissions:
  contents: write

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Unelte
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics onnx onnxslim onnxruntime
      - name: Export
        env:
          VARIANTA: ${{ inputs.varianta }}
          COPAC: ${{ inputs.copac }}
        run: |
          case "$VARIANTA" in s|m|l) ;; *) echo "varianta trebuie sa fie s, m sau l"; exit 1;; esac
          python - <<'EOF'
          from ultralytics import YOLO, YOLOWorld
          import shutil, os, numpy as np, onnxruntime as ort, urllib.request
          clase = ["pothole", os.environ["COPAC"], "traffic sign"]   # ordinea din model/labels.txt: groapa, copac, semn
          m = YOLOWorld(f"yolov8{os.environ['VARIANTA']}-worldv2.pt")
          m.set_classes(clase)
          m.save("drum_world.pt")                  # cuvintele se salvează în model înainte de export (altfel se pierd)
          m2 = YOLO("drum_world.pt")
          print("clase in model:", m2.names)
          urllib.request.urlretrieve("https://ultralytics.com/images/bus.jpg", "test.jpg")
          r = m2.predict("test.jpg", conf=0.01, verbose=False)[0]
          print("PyTorch pe poza de test:", [(m2.names[int(c)], round(float(s), 2)) for c, s in zip(r.boxes.cls, r.boxes.conf)][:10])
          f = m2.export(format="onnx", imgsz=640, simplify=True)
          shutil.copy(f, "drum_v2.onnx")
          r = YOLO("drum_v2.onnx", task="detect").predict("test.jpg", conf=0.01, verbose=False)[0]
          print("ONNX pe poza de test:   ", [(int(c), round(float(s), 2)) for c, s in zip(r.boxes.cls, r.boxes.conf)][:10])
          EOF
          ls -la drum_v2.onnx
      - name: Publicare (Release "model")
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANTA: ${{ inputs.varianta }}
        run: |
          gh release delete model -R $GITHUB_REPOSITORY --yes --cleanup-tag 2>/dev/null || true
          gh release create model drum_v2.onnx -R $GITHUB_REPOSITORY --target $GITHUB_SHA \
            --title "Model copaci (YOLO-World $VARIANTA)" \
            --notes "Model care cauta dupa nume: groapa (pothole), copac (tree trunk), indicator (traffic sign). Se pune in folderul model al programului Drum."
