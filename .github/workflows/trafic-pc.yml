name: Construieste Trafic_PC.exe

# Construiește exe-ul din trafic_pc/ (CONSTRUIESTE_EXE.bat) și îl publică în Release trafic-pc.
on:
  push:
    branches: [main]
    paths: ["trafic_pc/**", ".github/workflows/trafic-pc.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Construire (CONSTRUIESTE_EXE.bat)
        shell: cmd
        run: cmd /c "trafic_pc\CONSTRUIESTE_EXE.bat < nul > build.log 2>&1" || (powershell -c "Get-Content build.log -Tail 40" & exit 1)

      - name: Verificare
        shell: pwsh
        run: |
          Get-Content build.log -Tail 15
          if (-not (Test-Path trafic_pc/dist/Trafic_PC_autonom.exe)) { throw "lipseste Trafic_PC_autonom.exe" }
          if (-not (Test-Path trafic_pc/dist/Trafic_PC_portabil.zip)) { throw "lipseste Trafic_PC_portabil.zip" }
          $p = Start-Process trafic_pc/dist/Trafic_PC_autonom.exe -PassThru
          Start-Sleep 25
          if ($p.HasExited) { throw "exe-ul s-a inchis singur (cod $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Publicare (Release trafic-pc)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = "trafic_pc/dist"
          gh release delete trafic-pc -R $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          gh release create trafic-pc "$d/Trafic_PC_autonom.exe" "$d/Trafic_PC_portabil.zip" -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Trafic_PC.exe" --notes "Numararea traficului din filmari si camere. Construit $(Get-Date -Format 'dd.MM.yyyy HH:mm')."
          exit 0
