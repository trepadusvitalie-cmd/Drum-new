name: Construieste PDF_PC.exe

# Construiește exe-ul din pdf_pc/ și îl publică în Release pdf-pc (același link de descărcare).
on:
  push:
    branches: [main, "claude/**"]
    paths: ["pdf_pc/**", ".github/workflows/pdf-pc.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"          # ultima versiune care merge pe Windows 7
          architecture: x86              # 32 de biți: pornește pe Windows 7/8/10/11, 32 și 64 de biți

      - name: Construire
        working-directory: pdf_pc
        run: |
          python -m pip install -q "pyinstaller==5.13.2" "pymupdf==1.22.5" "pillow==9.5.0" "pywin32==306" "tkinterdnd2==0.3.0"
          python -c "import fitz, PIL, semnatura_nume as S; print(fitz.VersionBind, PIL.__version__, [n for n, _ in S.fonturi()])"
          python -m PyInstaller --noconfirm --onefile --windowed --name PDF_PC --icon pdf_pc.ico --add-data "pdf_pc.ico;." --add-data "fonturi;fonturi" --hidden-import semnatura_nume --collect-all fitz --collect-all tkinterdnd2 --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes --hidden-import PIL.ImageTk --exclude-module matplotlib --exclude-module numpy --exclude-module PyQt5 --exclude-module PySide6 pdf_pc.py

      - name: Test pornire (15 s fara eroare)
        shell: pwsh
        run: |
          $p = Start-Process pdf_pc\dist\PDF_PC.exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "exe-ul s-a inchis singur (cod $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Capturi de ecran
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:APPDATA\PDF_PC", capturi | Out-Null
          '{"meniu_intrebat": true, "semn_nume": "Alexandru Jalbă"}' | Set-Content -Encoding utf8 "$env:APPDATA\PDF_PC\setari.json"
          python -c "import fitz; d=fitz.open(); p=d.new_page(); p.insert_text((72,90),'Contract de prestari servicii',fontsize=20); [p.insert_text((72,140+i*18),'Textul documentului, randul %d.'%(i+1),fontsize=11) for i in range(25)]; d.save('capturi/exemplu.pdf')"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Poza($f) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
            $g = [Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size); $bmp.Save($f); $g.Dispose(); $bmp.Dispose() }
          $env:PDF_PC_DEMO = "fereastra"; $p = Start-Process pdf_pc\dist\PDF_PC.exe -ArgumentList "capturi\exemplu.pdf" -PassThru
          Start-Sleep 12; Poza "capturi\1_fereastra.png"; Stop-Process -Id $p.Id -Force; Start-Sleep 2
          $env:PDF_PC_DEMO = "semn"; $p = Start-Process pdf_pc\dist\PDF_PC.exe -ArgumentList "capturi\exemplu.pdf" -PassThru
          Start-Sleep 14; Poza "capturi\2_semnatura_din_nume.png"; Stop-Process -Id $p.Id -Force
          Copy-Item pdf_pc\dist\PDF_PC.exe capturi\
          Compress-Archive -Path pdf_pc\dist\PDF_PC.exe -DestinationPath capturi\PDF_PC.zip -Force
          Remove-Item capturi\PDF_PC.exe
          Set-Location capturi; git init -q -b pdf-pc-capturi
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A; git commit -q -m "capturi + PDF_PC.zip din $env:GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:pdf-pc-capturi

      - name: Publicare (Release pdf-pc)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path pdf_pc/dist/PDF_PC.exe -DestinationPath pdf_pc/dist/PDF_PC.zip -Force   # pentru calculatoarele unde .exe nu se poate descarca
          gh release delete pdf-pc -R $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          gh release create pdf-pc "pdf_pc/dist/PDF_PC.exe" "pdf_pc/dist/PDF_PC.zip" -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "PDF_PC.exe" --notes "Editor PDF: pagini A0-A5, completare si semnare, combinare PDF/Word/Excel/imagini. Construit $(Get-Date -Format 'dd.MM.yyyy HH:mm')."
          exit 0
