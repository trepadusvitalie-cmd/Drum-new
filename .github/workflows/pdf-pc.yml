name: Construieste PDF_PC.exe

# Construiește exe-ul din pdf_pc/ și îl publică în Release pdf-pc (același link de descărcare).
on:
  push:
    branches: [main]
    paths: ["pdf_pc/**", ".github/workflows/pdf-pc.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire
        working-directory: pdf_pc
        run: |
          python -m pip install -q pyinstaller pymupdf pillow pywin32 tkinterdnd2
          python -m PyInstaller --noconfirm --onefile --windowed --name PDF_PC --icon pdf_pc.ico --add-data "pdf_pc.ico;." --collect-all pymupdf --collect-all tkinterdnd2 --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes --hidden-import PIL.ImageTk --exclude-module matplotlib --exclude-module numpy --exclude-module PyQt5 --exclude-module PySide6 pdf_pc.py

      - name: Test pornire (15 s fara eroare)
        shell: pwsh
        run: |
          $p = Start-Process pdf_pc\dist\PDF_PC.exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "exe-ul s-a inchis singur (cod $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Publicare (Release pdf-pc)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pdf-pc -R $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          gh release create pdf-pc "pdf_pc/dist/PDF_PC.exe" -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "PDF_PC.exe" --notes "Editor PDF: pagini A0-A5, completare si semnare, combinare PDF/Word/Excel/imagini. Construit $(Get-Date -Format 'dd.MM.yyyy HH:mm')."
          exit 0
