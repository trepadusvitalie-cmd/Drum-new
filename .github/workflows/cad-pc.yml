name: Construieste CAD_PC.exe

# Construiește exe-ul din cad_pc/ și îl publică în Release cad-pc (același link de descărcare).
on:
  push:
    branches: [main]
    paths: ["cad_pc/**", ".github/workflows/cad-pc.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire
        working-directory: cad_pc
        run: |
          python -m pip install -q pyinstaller ezdxf pywin32 openpyxl pymupdf pillow pyshp xlwt pyogrio numpy
          python -m PyInstaller --noconfirm --onefile --windowed --name CAD_PC --collect-all ezdxf --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes --hidden-import openpyxl --collect-all pymupdf --hidden-import fitz --hidden-import win32print --hidden-import win32ui --hidden-import win32gui --hidden-import win32con --hidden-import PIL.ImageWin --hidden-import PIL.ImageTk --hidden-import PIL.TiffImagePlugin --hidden-import shapefile --hidden-import xlwt --collect-all pyogrio --exclude-module matplotlib --exclude-module PyQt5 --exclude-module PySide6 cad.py

      - name: Test pornire (15 s fara eroare)
        shell: pwsh
        run: |
          $p = Start-Process cad_pc\dist\CAD_PC.exe -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "exe-ul s-a inchis singur (cod $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Publicare (Release cad-pc)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cad-pc -R $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          gh release create cad-pc "cad_pc/dist/CAD_PC.exe" -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "CAD_PC.exe" --notes "Editor DWG/DXF cu interfata ca AutoCAD 2025. Construit $(Get-Date -Format 'dd.MM.yyyy HH:mm')."
          exit 0
