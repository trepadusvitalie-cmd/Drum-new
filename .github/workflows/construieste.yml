name: Construieste Drum_Analiza.exe

# Construiește exe-ul din drum_pc/ și îl publică în Release v1 (același link de descărcare).
on:
  push:
    branches: [drum-vechi-nu-se-porneste]
    paths: ["drum_pc/**", ".github/workflows/construieste.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Construire (CONSTRUIESTE_EXE.bat)
        shell: cmd
        run: cmd /c "drum_pc\CONSTRUIESTE_EXE.bat < nul > build.log 2>&1" || (powershell -c "Get-Content build.log -Tail 40" & exit 1)

      - name: Verificare
        shell: pwsh
        run: |
          $d = "drum_pc\dist"
          Get-ChildItem $d | Format-Table Name, Length
          if (-not (Test-Path "$d\Drum_Analiza_autonom.exe")) { throw "lipseste exe-ul autonom" }
          if (-not (Get-ChildItem -Recurse "$d\Drum_Analiza\_internal" -Filter "cv2*.pyd")) { throw "lipseste OpenCV" }
          if (-not (Test-Path "$d\Drum_Analiza\_internal\rcr\model_indicatoare.npz")) { throw "lipseste clasificatorul de indicatoare (rcr)" }

      - name: Test pornire (20 s fara eroare)
        shell: pwsh
        run: |
          $p = Start-Process drum_pc\dist\Drum_Analiza\Drum_Analiza.exe -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "exe-ul s-a inchis singur (cod $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Publicare (Release v1)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = "drum_pc/dist"
          gh release delete v1-vechi -R $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          gh release create v1-vechi "$d/Drum_Analiza_autonom.exe" "$d/Drum_Analiza_portabil.zip" -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA `
            --title "Drum_Analiza.exe (versiunea de dinainte de 29.10)" --notes "Programul Drum RM – Analiza pentru PC. Construit $(Get-Date -Format 'dd.MM.yyyy HH:mm')."
